# binpack decides whether draining one node would leave every one of its pods
# schedulable elsewhere, and drains it only when the answer is yes.

image:
  repository: ghcr.io/motleyhand/binpack
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# binpack's own configuration, rendered into a ConfigMap. Every field is
# optional: pools and their bounds are discovered from the cluster-autoscaler,
# so an empty document is a working configuration.
#
# See docs/reference/configuration.md. Check a document before applying it with
# `binpack config validate -f values-fragment.yaml`.
config:
  # Decide everything, change nothing. Acting is opt-in, deliberately: a tool
  # that drains nodes should be one you switched on, not one you inherited.
  #
  # Leave this true until `binpack explain` has told you something you agree
  # with. Each evaluation reaches the identical decision either way, so the
  # events on nodes name the node binpack would drain and why — but nothing is
  # drained, so they cannot show you what happens after the first one.
  #
  # Setting it false also requires rbac.allowDraining: true; the chart refuses
  # one without the other.
  #
  # See docs/how-to/let-binpack-drain-nodes.md.
  dryRun: true
  interval: 1m0s

rbac:
  # The ClusterRole, the kube-system Role for the autoscaler's status, and the
  # bindings. Turn off only if you manage RBAC separately.
  create: true
  # Grant the verbs binpack needs to act: patching nodes, and creating pod
  # evictions. Required when config.dryRun is false, and refused by the chart
  # if you set one without the other — that combination installs cleanly and
  # then fails on every attempt, which is a worse way to find out.
  #
  # Left off by default so an install can only ever report until somebody
  # decides otherwise, and so the permission and the intent are granted in the
  # same change.
  allowDraining: false

serviceAccount:
  # The account binpack runs as, and the subject of every binding above.
  create: true
  # Required when create is false, and the chart refuses to render without it.
  # Helm's scaffold defaults that case to the namespace's `default` account —
  # the one every pod that names none already has — so binpack's cluster-wide
  # node and eviction verbs would be granted to all of them. binpack runs
  # perfectly well as `default`, so nothing would ever report it.
  name: ""
  annotations: {}

# One replica is the right number: only the leader acts, so a second is a
# warm spare rather than more throughput.
replicaCount: 1

leaderElection:
  # On by default. A single replica still runs two pods during a rolling
  # update, and two binpacks draining at once is precisely what the lease
  # prevents.
  enabled: true

  # Lease timings. Left unset so the binary owns the defaults — it sizes them
  # for a controller that evaluates once a minute, which tolerates a slow
  # handover far better than it tolerates restarting on a control-plane
  # hiccup. Set them only if your API server is slower still.
  #
  #   leaseDuration: 60s   how long the lease is held before another replica may take it
  #   renewDeadline: 40s   how long the leader keeps trying before giving up and exiting
  #   retryPeriod:   10s   how often the lease is renewed or contested
  #
  # renewDeadline must be shorter than leaseDuration, and longer than
  # retryPeriod times 1.2 — retries are jittered, and client-go refuses
  # timings that leave no room for that. binpack checks the same thing at
  # startup rather than letting the pod crash-loop on it.
  leaseDuration: ""
  renewDeadline: ""
  retryPeriod: ""

metrics:
  enabled: true
  port: 8080

  # Prometheus operator discovery. Set one of these; both need the operator's
  # CRDs, and both need `labels` to match your Prometheus's selector — check it
  # with:
  #
  #   kubectl get prometheus -A -o jsonpath='{.items[*].spec.podMonitorSelector}'
  #
  # A PodMonitor is the better fit and is why the Service is off by default.
  # Prometheus does not scrape through a Service's ClusterIP — the operator
  # resolves its Endpoints and scrapes each pod directly — so a Service exists
  # only to give a ServiceMonitor something to select, and binpack serves
  # nothing to anyone. Use the ServiceMonitor path if your Prometheus is
  # configured to discover only those.
  podMonitor:
    enabled: false
    interval: 60s
    labels: {}

  serviceMonitor:
    enabled: false
    interval: 60s
    labels: {}

  service:
    # Only useful alongside serviceMonitor.enabled, or to scrape by hand.
    enabled: false

probes:
  port: 8081

# Measured, not guessed. Against a 4-node, 145-pod cluster binpack settles at
# 43 MiB resident (21 MiB heap in use) and spends about half a second per
# evaluation — roughly 10m of CPU at the default one-minute interval.
#
# Memory scales with the number of objects cached, not with load: every pod,
# node and disruption budget, plus the pod template of each controller. The
# fixed cost of the Go runtime and client-go dominates on a small cluster, so
# do not read 43 MiB / 145 pods as a per-pod figure — but do raise the limit
# on a large one, where the initial LIST of every pod is the peak rather than
# the steady state.
#
# There is deliberately no CPU limit. Throttling a controller that wakes once a
# minute buys nothing and turns a slow evaluation into a stalled one.
resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 256Mi

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  # Numeric, and stated here as well as in the image. runAsNonRoot makes the
  # kubelet verify the user before starting the container, and it cannot do
  # that from a name — so an image declaring `nonroot` rather than 65532 fails
  # to start with "cannot verify user is non-root". Setting it in the chart
  # means that holds even for someone pointing image.repository at a build of
  # their own.
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

nodeSelector: {}
tolerations: []
affinity: {}

# binpack is relocatable like any other workload and is not special-cased: a
# drain that moves it simply resumes on the new node, and the lease means the
# replacement does not act until the old one has stopped.
priorityClassName: ""
