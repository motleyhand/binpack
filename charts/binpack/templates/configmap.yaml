apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "binpack.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "binpack.labels" . | nindent 4 }}
data:
  config.yaml: |
    apiVersion: binpack.motleyhand.com/v1alpha1
    kind: BinpackConfig
{{ toYaml .Values.config | indent 4 }}
