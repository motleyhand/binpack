{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "binpack.fullname" . }}
  labels: {{- include "binpack.labels" . | nindent 4 }}
rules:
  # Read the cluster state every decision is derived from.
  - apiGroups: [""]
    resources: [nodes, pods]
    verbs: [get, list, watch]

  # Predicting evictability before attempting it.
  - apiGroups: ["policy"]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch]

  # Pod templates: what a controller would create to replace an evicted pod.
  # Read-only, and never written — scaling a workload down would be a far
  # blunter instrument than moving its pods.
  - apiGroups: ["apps"]
    resources: [replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: ["batch"]
    resources: [jobs]
    verbs: [get, list, watch]

  # Explaining decisions on the Node object itself. binpack writes these
  # through the modern events API, so a rule granting only ""/events would let
  # it report nothing. Leader election is the other way round and is granted
  # separately below — the two APIs are both in use, for different reasons.
  #
  # `patch` is the aggregation: repeats of one decision become a count on the
  # existing event rather than a new object, and client-go applies that count
  # as a strategic-merge patch. `update` was granted too and never issued —
  # see internal/controller's TestTheEventRecorderNeverIssuesAnUpdate, which is
  # what would notice if a client-go release started issuing one.
  - apiGroups: ["events.k8s.io"]
    resources: [events]
    verbs: [create, patch]
{{- if .Values.rbac.allowDraining }}

  # Cordon, uncordon, and the drain marker annotations. The only mutating verb
  # on cluster state: binpack never deletes a node, since that is the
  # cluster-autoscaler's job and the division is the whole design.
  - apiGroups: [""]
    resources: [nodes]
    verbs: [patch]

  # Eviction is a create on a subresource, and unlike pods: delete it respects
  # PodDisruptionBudgets. binpack does not request pods: delete and should not
  # be granted it.
  - apiGroups: [""]
    resources: [pods/eviction]
    verbs: [create]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "binpack.fullname" . }}
  labels: {{- include "binpack.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "binpack.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "binpack.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# The cluster-autoscaler's status, scoped to the namespace it publishes into
# rather than restricted by resourceNames.
#
# A ClusterRole naming cluster-autoscaler-status would in fact authorise every
# read binpack makes today, and this comment used to say it would not: the API
# server takes the name of a list or watch from an exact-match metadata.name
# field selector, and binpack's cache sends one. What it would authorise is a
# grant conditional on the client's own query — the same rule stops working
# the day that selector is dropped, and it carries the name into every
# namespace in the cluster, not the one the autoscaler publishes into.
#
# Narrowing by namespace holds regardless of how binpack asks. binpack still
# reads only the one object, because the cache sends that selector either way;
# the difference is that here it is binpack declining to read the rest rather
# than Kubernetes refusing.
#
# The namespace follows config.discovery.autoscalerNamespace, because that is
# the namespace binpack will read. The autoscaler publishes into the namespace
# it runs in, which its own chart sets to whatever you install it into, so
# kube-system is a common answer rather than the only one — and a Role pinned
# there while binpack reads elsewhere is an install that succeeds and then 403s
# on every evaluation.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "binpack.fullname" . }}-autoscaler-status
  namespace: {{ include "binpack.autoscalerNamespace" . | quote }}
  labels: {{- include "binpack.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "binpack.fullname" . }}-autoscaler-status
  namespace: {{ include "binpack.autoscalerNamespace" . | quote }}
  labels: {{- include "binpack.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "binpack.fullname" . }}-autoscaler-status
subjects:
  - kind: ServiceAccount
    name: {{ include "binpack.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.leaderElection.enabled }}
---
# Leader election only. Omit it and set leaderElection.enabled=false if you
# accept that a rolling update briefly runs two.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "binpack.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels: {{- include "binpack.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]

  # Leader election announces itself on the Lease through client-go's legacy
  # recorder, which writes to the *core* group — unlike binpack's own events.
  # Scoped here rather than to the ClusterRole because these events are about
  # a Lease in this namespace, and because they stop existing entirely when
  # leader election is off.
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "binpack.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels: {{- include "binpack.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "binpack.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "binpack.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
