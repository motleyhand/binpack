version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # Kubernetes libraries move in lockstep; separate PRs for each would
      # never build on their own.
      kubernetes:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"

  # The differential harness is its own module so that k8s.io/kubernetes and
  # its replace block stay out of what binpack ships.
  - package-ecosystem: gomod
    directory: /test/differential
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      kubernetes:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5

  # The Dockerfile's base image, which is pinned by digest. Without this entry
  # the pin is a freeze: `nonroot` is not a version tag, so nothing else would
  # ever propose the new digest, and the CA bundle and tzdata that base carries
  # would age indefinitely. dependabot proposes a digest bump under an
  # unchanged tag only for a non-version tag, which is exactly this one.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
