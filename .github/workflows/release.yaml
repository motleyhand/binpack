name: release

on:
  push:
    tags: ["v*"]

# The tag is the trigger and the source of every version number: the binary's,
# the image's, the chart's and its appVersion. Nothing is edited by hand at
# release time, so there is no way for them to disagree.
permissions:
  contents: write
  packages: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser builds the changelog from the commits since the previous
          # tag, which it cannot see in a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # `make check` starts with `make lint`, so the linter has to be here as
      # well as in the build job. Pinned to the same version: a release that
      # fails on a lint rule the pull request never ran is a release blocked by
      # a disagreement between two workflows.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      # Everything CI runs, again. A tag skipping the tests it was cut from is
      # how a release gets published from a commit nobody verified — the branch
      # may have been green hours and several merges ago.
      - name: Verify
        run: make check

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  chart:
    name: chart
    runs-on: ubuntu-latest
    # After the image exists. A chart whose default image cannot be pulled is
    # an install that fails at the last step, having already created the RBAC.
    needs: release
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v4

      # Through the environment rather than interpolated into the script:
      # ${{ }} is substituted before the shell ever sees it, so a value
      # containing shell syntax would be executed rather than passed.
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" \
            | helm registry login ghcr.io -u "$GHCR_USER" --password-stdin

      # The chart version tracks the binary exactly, stamped from the tag
      # rather than maintained in the file. The two cannot drift, and the chart
      # always ships the RBAC the binary it names actually needs — which is not
      # hypothetical: the role and the code have disagreed twice in this
      # repository's short history.
      - name: Stamp the chart version from the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed -i "s/^version: .*/version: ${version}/" charts/binpack/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"${version}\"/" charts/binpack/Chart.yaml
          helm lint charts/binpack

      - name: Package and push
        run: |
          helm package charts/binpack --destination /tmp/chart
          helm push /tmp/chart/binpack-*.tgz oci://ghcr.io/motleyhand/charts
