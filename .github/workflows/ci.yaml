name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: Test
        run: go test -race ./...

      - name: Build
        run: make build

      - name: Smoke test the binary
        run: ./bin/binpack version

  differential:
    name: differential (vs real scheduler)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: test/differential/go.sum

      # A separate module, so k8s.io/kubernetes and the replace block it
      # requires stay out of the module binpack ships. See ADR-0006.
      - name: Verify the harness module is tidy
        working-directory: test/differential
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Compare fit against the scheduler's own Filter plugins
        working-directory: test/differential
        run: go test -v ./...

  release-config:
    name: validate release config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Builds every target and the container image without publishing
      # anything, so a broken release config fails here rather than on a tag.
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
