name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # internal/cli and internal/controller render the chart and read the
      # manifests back, so the test job needs helm as much as the chart job
      # does. Absent, those tests fail rather than skipping.
      - uses: azure/setup-helm@v5

      - name: Verify go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: Test
        run: go test -race ./...

      - name: Build
        run: make build

      - name: Smoke test the binary
        run: ./bin/binpack version

      # The workflows parse, and release.yaml — which runs only on tags — can
      # actually run the `make check` it calls. Both were broken here once.
      - name: Check the workflows
        run: python3 hack/check-workflows.py

      # A named USER builds, lints and validates cleanly, and then fails to
      # start on any cluster enforcing runAsNonRoot. Nothing else here sees it.
      - name: Check the image user is numeric
        run: python3 hack/check-image-user.py


  chart:
    name: helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - name: Lint
        run: helm lint charts/binpack

      # Rendered with the defaults and with everything switched on, because a
      # template only referenced under a condition is one `helm lint` never
      # parses — and the conditional paths are the RBAC and the monitors,
      # which is where a mistake costs the most.
      - name: Render with defaults
        run: helm template binpack charts/binpack --namespace binpack-system

      - name: Render with every option enabled
        run: |
          helm template binpack charts/binpack --namespace binpack-system \
            --set rbac.allowDraining=true \
            --set metrics.podMonitor.enabled=true \
            --set metrics.serviceMonitor.enabled=true \
            --set metrics.service.enabled=true \
            --set leaderElection.enabled=false \
            --set serviceAccount.create=false \
            --set serviceAccount.name=externally-managed

      # A chart that installs cleanly and then cannot work is the failure worth
      # catching at render time: binpack would hold its lease, serve its
      # metrics, and be refused by RBAC on every eviction. Asserted in both
      # directions, since a guard that always fails is as wrong as one that
      # never does — and externally managed RBAC must still be able to act.
      - name: Acting without acknowledging the permissions is refused
        run: |
          set +e
          for args in "--set config.dryRun=false" \
                      "--set config.dryRun=false --set rbac.create=false"; do
            out=$(helm template binpack charts/binpack --namespace binpack-system $args 2>&1)
            if [ $? -eq 0 ]; then
              echo "rendered with $args, which would install a binpack that cannot act"; exit 1
            fi
            case "$out" in
              *dryRun*) ;;
              *) echo "refused $args without explaining why:"; echo "$out"; exit 1 ;;
            esac
          done
          set -e
          for args in "--set config.dryRun=false --set rbac.allowDraining=true" \
                      "--set config.dryRun=false --set rbac.create=false --set rbac.allowDraining=true"; do
            helm template binpack charts/binpack --namespace binpack-system $args > /dev/null \
              || { echo "refused a valid acting configuration: $args"; exit 1; }
          done

      # An externally managed ServiceAccount has to be named. Helm's scaffold
      # falls back to the namespace's `default` account, which is the one every
      # pod that names none already has — so binpack's cluster-wide `nodes:
      # patch` and `pods/eviction: create` would be granted to all of them,
      # while binpack itself ran perfectly well and reported nothing. Asserted
      # in both directions, since a refusal that fired one step too eagerly
      # would break every ordinary install instead.
      - name: An unnamed external ServiceAccount is refused, not defaulted
        run: |
          set +e
          out=$(helm template binpack charts/binpack --namespace binpack-system \
            --set rbac.allowDraining=true --set serviceAccount.create=false 2>&1)
          if [ $? -eq 0 ]; then
            echo "rendered without a ServiceAccount name, binding binpack's roles to default"
            exit 1
          fi
          case "$out" in
            *serviceAccount.name*) ;;
            *) echo "refused without naming the value to set:"; echo "$out"; exit 1 ;;
          esac
          set -e

          # The chart's own account, and an external one that is named. Three
          # subjects each: the ClusterRoleBinding, the autoscaler-status
          # RoleBinding in kube-system, and the leader-election RoleBinding.
          helm template binpack charts/binpack --namespace binpack-system \
            --set rbac.allowDraining=true > /tmp/sa-created.yaml
          helm template binpack charts/binpack --namespace binpack-system \
            --set rbac.allowDraining=true \
            --set serviceAccount.create=false --set serviceAccount.name=mine > /tmp/sa-named.yaml
          [ "$(grep -c '^    name: binpack$' /tmp/sa-created.yaml)" = 3 ] \
            || { echo "the created ServiceAccount is not the subject of all three bindings"; exit 1; }
          [ "$(grep -c '^    name: mine$' /tmp/sa-named.yaml)" = 3 ] \
            || { echo "the named ServiceAccount is not the subject of all three bindings"; exit 1; }
          for rendered in /tmp/sa-created.yaml /tmp/sa-named.yaml; do
            if grep -q "name: default" $rendered; then
              echo "a binding subject is the default ServiceAccount: $rendered"; exit 1
            fi
          done

      # podLabels is exposed for arbitrary additions, so it can name a
      # selector label. Appending it would produce either a duplicate YAML key
      # or a Deployment whose selector no longer matches its own template, and
      # the API server rejects the second — after install, on someone's
      # cluster.
      - name: Pod labels cannot displace the selector labels
        run: |
          helm template binpack charts/binpack --namespace binpack-system \
            --set 'podLabels.app\.kubernetes\.io/name=hijacked' \
            --set podLabels.team=platform > /tmp/labels.yaml
          grep -q "app.kubernetes.io/name: binpack" /tmp/labels.yaml
          grep -q "team: platform" /tmp/labels.yaml
          if grep -q "hijacked" /tmp/labels.yaml; then
            echo "podLabels displaced a selector label"; exit 1
          fi

      # The rendered manifests must be something a cluster would accept, which
      # neither lint nor template checks: both are happy with a well-formed
      # document naming a field that does not exist.
      - name: Validate the rendered manifests against the API schema
        run: |
          helm template binpack charts/binpack --namespace binpack-system \
            --set rbac.allowDraining=true > /tmp/rendered.yaml
          curl -sSL -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          /tmp/kubeconform -strict -summary /tmp/rendered.yaml

  differential:
    name: differential (vs real scheduler)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: test/differential/go.sum

      # A separate module, so k8s.io/kubernetes and the replace block it
      # requires stay out of the module binpack ships. See ADR-0006.
      - name: Verify the harness module is tidy
        working-directory: test/differential
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      # -count=1 disables the test result cache, and it is load-bearing rather
      # than belt-and-braces. TestHarnessTracksTheShippedLibraries compares this
      # module's replace block against the main module's go.mod, which is
      # outside this module — and Go's test cache keys a package only on files
      # inside it, so a bump that touches the main module and nothing here
      # replays a stale PASS. That is exactly the change the test exists to
      # catch. It cost two merges of a green-but-blind harness in v0.3.0's
      # development; the whole suite runs in under a second, so caching it
      # saves nothing worth this.
      - name: Compare fit against the scheduler's own Filter plugins
        working-directory: test/differential
        run: go test -count=1 -v ./...

  release-config:
    name: validate release config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # dockers_v2 builds linux/arm64 as well, which needs emulation on an
      # amd64 runner. Without these the snapshot fails here for a reason that
      # has nothing to do with the config being wrong.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      # Builds every target and the container image without publishing
      # anything, so a broken release config fails here rather than on a tag.
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
