# Releases binpack: binaries, a multi-platform container image on GHCR, and a
# GitHub release. The Helm chart is pushed separately by the release workflow,
# since its version is locked to this one and Helm speaks OCI directly.
#
# CI runs `release --snapshot --clean --skip=publish` on every pull request, so
# a broken config fails on the PR rather than on a tag.
version: 2

project_name: binpack

before:
  hooks:
    - go mod tidy

builds:
  - id: binpack
    main: ./cmd/binpack
    binary: binpack
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/motleyhand/binpack/internal/version.version={{ .Version }}
      - -X github.com/motleyhand/binpack/internal/version.commit={{ .FullCommit }}
      - -X github.com/motleyhand/binpack/internal/version.date={{ .CommitDate }}
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

# dockers_v2, not the `dockers` block GoReleaser has been warning about. It
# builds every platform from one entry and pushes a manifest itself, so the
# separate docker_manifests section the old form needed is gone.
#
# Deferred twice waiting for the schema: `dockers_v2` was absent from
# GoReleaser's published schema.json when this config was first written, and
# guessing at somebody else's format is how a release breaks on the tag rather
# than on the pull request. It is there now, and this follows it.
dockers_v2:
  - images:
      - ghcr.io/motleyhand/binpack
    dockerfile: Dockerfile
    # arm64 because managed Kubernetes increasingly is: Graviton on EKS, Ampere
    # on GKE and DOKS. A tool for reducing node cost that only runs on amd64
    # would be an odd thing.
    platforms:
      - linux/amd64
      - linux/arm64
    tags:
      - "{{ .Version }}"
      # Only for a real, non-prerelease tag: `latest` pointing at a release
      # candidate is how somebody installs one by accident.
      - "{{ if not .Prerelease }}latest{{ end }}"
    labels:
      org.opencontainers.image.source: https://github.com/motleyhand/binpack
      org.opencontainers.image.description: Consolidate nodes a managed cluster-autoscaler will not remove
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: Apache-2.0

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  # Drafted rather than published outright: a release is the one action here
  # that cannot be taken back, and the tag has already built everything by the
  # time anyone reads it.
  draft: true
  footer: |
    ## Install

    ```bash
    helm install binpack oci://ghcr.io/motleyhand/charts/binpack \
      --version {{ .Version }} --namespace binpack-system --create-namespace
    ```

    Dry run by default. See [the install guide](https://github.com/motleyhand/binpack/blob/main/docs/how-to/install-binpack.md).

    The list above is generated from commit subjects. What a name change means,
    and every deprecation, is in
    [CHANGELOG.md](https://github.com/motleyhand/binpack/blob/main/CHANGELOG.md),
    which [versioning](https://github.com/motleyhand/binpack/blob/main/docs/reference/versioning.md)
    makes the normative record.
