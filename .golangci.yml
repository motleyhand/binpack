version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - depguard
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - revive
    - unconvert
    - usetesting
    - wastedassign

  settings:
    depguard:
      rules:
        # ADR-0008: the decision engine is a pure function over data. It may
        # name Kubernetes API types — those are inert structs, constructible in
        # a test literal — but it must never hold anything that talks to a
        # cluster. A client is what forces a cluster into a test and what makes
        # behaviour depend on the environment; a type is not.
        #
        # Allowed: k8s.io/api, k8s.io/apimachinery, k8s.io/component-helpers.
        engine-purity:
          files:
            - "**/internal/engine/**"
          deny:
            - pkg: k8s.io/client-go
              desc: >-
                internal/engine must hold no cluster clients (ADR-0008). Take the
                objects as arguments; listing them is internal/collect's job.
            - pkg: sigs.k8s.io/controller-runtime
              desc: >-
                internal/engine must hold no cluster clients (ADR-0008). The
                manager, caches and clients belong in internal/controller.
            - pkg: k8s.io/kubectl
              desc: >-
                internal/engine must hold no cluster clients (ADR-0008).
                Eviction and drain helpers belong in internal/executor.

    revive:
      rules:
        - name: exported
          disabled: false

  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/motleyhand/binpack
