version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - depguard
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - revive
    - unconvert
    - usetesting
    - wastedassign

  settings:
    depguard:
      rules:
        # ADR-0008: these packages are pure functions over data. They may name
        # Kubernetes API types — those are inert structs, constructible in a
        # test literal — but must never hold anything that talks to a cluster,
        # or do I/O of any kind.
        #
        # An allowlist, not a denylist. A list of clients we remembered can
        # never be complete: k8s.io/metrics ships one, every cloud SDK ships
        # one, and the next Kubernetes release may add another. Anything not
        # named here is refused by default, which is the same reasoning
        # ADR-0006 applies to unmodelled scheduler constraints.
        #
        # Named `purity` rather than `engine-purity` because it no longer
        # covers only the engine, and the five packages are here for four
        # different reasons — each stated below, because a files: list nobody
        # can justify line by line is one the next entry gets added to by
        # sympathy rather than by argument.
        #
        # The set is closed: every package listed here may import only packages
        # that are also listed here. That is what makes the guarantee hold one
        # level down, and it is not an accident of the current import graph —
        # see the allow list.
        purity:
          files:
            # The decision engine itself, which is what ADR-0008 decided.
            - "**/internal/engine/**"
            # Held to the same rule by the same ADR, and the package most
            # likely to be tempted by a client when a predicate needs one more
            # fact.
            - "**/internal/fit/**"
            # The module's only importable package, so its dependency set is
            # public surface: anything it imports, a consumer importing the
            # configuration types inherits. docs/design/2026-08-15-architecture.md
            # has claimed this row was enforced since before it was.
            - "**/api/v1alpha1/**"
            # Its package doc says it "answers it as a pure function so the
            # judgement can be stated as a table". Held to what it claims.
            - "**/internal/drain/**"
            # The fixture package, which is here to keep the set closed. It
            # holds no client, but the packages above import it from their test
            # files — depguard checks those too — so admitting it unguarded
            # would let any of them reach a client one hop out. Its own purity
            # is the thing that makes admitting it safe, so it is enforced
            # rather than assumed.
            - "**/internal/mother/**"
          allow:
            - $gostd
            # The module, package by package rather than wholesale. Wholesale
            # stopped the rule at the package boundary instead of the
            # property's: internal/collect holds a client and neither
            # internal/drain nor api/v1alpha1 imports anything that would make
            # importing it a cycle, so a guarded package could have reached
            # cluster access through it with nothing failing. Every entry here
            # is a package this same rule guards.
            - github.com/motleyhand/binpack/api/v1alpha1
            - github.com/motleyhand/binpack/internal/engine
            - github.com/motleyhand/binpack/internal/fit
            - github.com/motleyhand/binpack/internal/drain
            - github.com/motleyhand/binpack/internal/mother
            - k8s.io/api
            - k8s.io/apimachinery
            - k8s.io/component-helpers
            # A parser, not a client: it converts bytes that are already in
            # hand and opens nothing. api/v1alpha1.Load takes those bytes as an
            # argument, which is what keeps the package free of I/O even though
            # reading configuration is its whole job.
            - sigs.k8s.io/yaml
            # Interfaces only, no implementation: some upstream signatures take
            # a logger, and logr.Discard satisfies them without doing anything.
            # k8s.io/klog is deliberately NOT allowed — it is a logging
            # implementation that writes, and klog.Logger is only an alias for
            # logr.Logger, so nothing is lost by refusing it.
            - github.com/go-logr/logr
          deny:
            # $gostd is allowed wholesale for the arithmetic and formatting
            # these packages genuinely need, so the I/O-capable corners of it
            # are named explicitly.
            - pkg: os
              desc: this package must perform no I/O (ADR-0008)
            - pkg: os/exec
              desc: this package must perform no I/O (ADR-0008)
            - pkg: net
              desc: this package must perform no I/O (ADR-0008)
            - pkg: net/http
              desc: this package must perform no I/O (ADR-0008)
            - pkg: database/sql
              desc: this package must perform no I/O (ADR-0008)

    revive:
      rules:
        - name: exported
          disabled: false

  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/motleyhand/binpack
